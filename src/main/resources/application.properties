spring.application.name=app_security

# H2 database stored in a local file
spring.datasource.url=jdbc:h2:file:./data/producthub
spring.datasource.username=sa
spring.datasource.password=

# Hibernate updates the database tables based on our Java entities
spring.jpa.hibernate.ddl-auto=update

# Enable the H2 web console
spring.h2.console.enabled=true